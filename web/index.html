<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <title>Claude Autopilot</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- İlerleme halkalarının ortak degradesi -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff8a5b"/>
        <stop offset=".55" stop-color="#e5689b"/>
        <stop offset="1" stop-color="#b45cff"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" id="brand-mark"></div>
        <div>
          <div class="brand-name">Autopilot</div>
          <div class="brand-sub">Claude kontrol merkezi</div>
        </div>
      </div>
      <button class="project-switch" id="sb-project" data-act="project-menu" aria-haspopup="menu" aria-label="Proje seç"></button>
      <nav class="nav" id="sb-nav" aria-label="Bölümler"></nav>
      <div class="sidebar-spacer"></div>
      <div class="engine-mini" id="sb-engine" aria-live="polite"></div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
